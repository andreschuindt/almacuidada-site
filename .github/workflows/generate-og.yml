name: Generate Open Graph Image

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-og.py"
      - ".github/workflows/generate-og.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Open Graph image
        run: python scripts/generate-og.py

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/og-alma-cuidada-comunidade-2026.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Gera imagem Open Graph da Alma Cuidada"
            git push
          fi
