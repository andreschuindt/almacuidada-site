name: Implementar logotipo oficial

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-official-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir e validar logotipo oficial
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/logo-part-01.txt tmp/logo-part-02.txt tmp/logo-part-03.txt tmp/logo-part-04.txt tmp/logo-part-05.txt > /tmp/logo.b64
          test "$(wc -c < /tmp/logo.b64)" -eq 58052
          base64 -d /tmp/logo.b64 > assets/logo-oficial-alma-cuidada.png
          python3 - <<'PY'
          import hashlib, struct
          p = "assets/logo-oficial-alma-cuidada.png"
          data = open(p, "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Arquivo gerado não é PNG válido"
          w, h = struct.unpack(">II", data[16:24])
          assert (w, h) == (256, 256), (w, h)
          assert len(data) == 43538, len(data)
          sha = hashlib.sha256(data).hexdigest()
          assert sha == "0e24d992225ed854cc2708f0fd4b46c0edefabda53ea327a5bf4ff54db2b1178", sha
          print("Logotipo validado:", w, h, sha)
          PY

      - name: Aplicar logotipo no cabeçalho, rodapé e celulares
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          pattern = re.compile(r'(<a class="brand"[^>]*>)\s*<svg[\s\S]*?</svg>\s*(<span class="brand-copy">)')
          replacement = r'\1<img class="brand-mark" src="assets/logo-oficial-alma-cuidada.png" alt="" aria-hidden="true">\2'
          html, count = pattern.subn(replacement, html)
          assert count == 2, f"Esperados 2 logotipos de marca; encontrados {count}"

          css = """
    .brand img.brand-mark{width:48px;height:48px;object-fit:contain;flex:0 0 48px}
    @media(max-width:640px){.brand img.brand-mark{width:40px;height:40px;flex:0 0 40px}}
          """.strip()
          if ".brand img.brand-mark" not in html:
              html = html.replace("</style>", css + "\n  </style>", 1)

          index_path.write_text(html, encoding="utf-8")

          mobile_path = Path("assets/plataforma-mobile.svg")
          svg = mobile_path.read_text(encoding="utf-8")
          logo_pattern = re.compile(r'\s*<!-- logotipo inspirado diretamente no anexo fornecido -->\s*<g transform="translate\(360 92\)">[\s\S]*?</g>')
          new_logo = """
  <!-- logotipo oficial Alma Cuidada -->
  <image href="logo-oficial-alma-cuidada.png"
         x="245" y="35" width="230" height="230"
         preserveAspectRatio="xMidYMid meet"/>
          """.rstrip()
          svg, logo_count = logo_pattern.subn("\n" + new_logo, svg, count=1)
          assert logo_count == 1, f"Bloco antigo do logotipo não encontrado: {logo_count}"
          mobile_path.write_text(svg, encoding="utf-8")
          PY

      - name: Remover arquivos temporários
        shell: bash
        run: |
          rm -f tmp/logo-part-01.txt tmp/logo-part-02.txt tmp/logo-part-03.txt tmp/logo-part-04.txt tmp/logo-part-05.txt tmp/test.txt

      - name: Publicar alterações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/plataforma-mobile.svg assets/logo-oficial-alma-cuidada.png tmp || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Implementa logotipo oficial da Alma Cuidada"
          git pull --rebase origin main
          git push origin main
