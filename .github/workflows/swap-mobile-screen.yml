name: Atualizar tela mobile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/swap-mobile-screen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trocar imagem da tela do celular
        run: |
          sed -i 's#assets/plataforma-mobile.jpg#assets/plataforma-mobile.svg#g' index.html
      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Exibe nova tela de login no celular"
            git push
          fi
