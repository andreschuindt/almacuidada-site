name: Ajustar layout responsivo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-responsive-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inserir stylesheet responsivo
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); link='<link rel=\"stylesheet\" href=\"assets/responsive-fix.css?v=20260829\">'; s=s if link in s else s.replace('</head>', '  '+link+'\n</head>', 1); p.write_text(s, encoding='utf-8')"

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Aplica layout responsivo refinado"
            git pull --rebase origin main
            git push origin main
          fi
