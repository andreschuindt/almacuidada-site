<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Projeto INSPIRA — correção final do carrossel</title>
<style>html,body{margin:0;min-height:100%;background:#F7F2EC;color:#4A2E4C;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px}.loading strong{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem}</style>
</head>
<body>
<div class="loading"><strong>Carregando a visualização atualizada do INSPIRA…</strong></div>
<script>
(async function(){
  try{
    const res=await fetch('/inspira-v2-1-preview-corrigido.html?loader=20260904-diariamente-webp-v9',{cache:'no-store'});
    let html=await res.text();
    html=html.replace(/20260904-diariamente-webp-v8/g,'20260904-diariamente-webp-v9');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><strong>Não foi possível carregar a visualização atualizada.</strong></div>';
  }
})();
</script>
</body>
</html>
