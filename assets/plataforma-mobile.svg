<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1026" viewBox="0 0 720 1026" role="img" aria-labelledby="title desc">
  <title id="title">Tela de login Alma Cuidada</title>
  <desc id="desc">Tela de acesso com logotipo Alma Cuidada, e-mail eusou@almacuidada.com.br, campo de senha e botões de acesso.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0C"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" x2="1">
      <stop offset="0" stop-color="#9516A9"/>
      <stop offset="1" stop-color="#A934B8"/>
    </linearGradient>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .serif{font-family:Georgia,"Times New Roman",serif}
      .label{font:24px Inter,Arial,Helvetica,sans-serif;fill:#F6F6F8}
      .small{font:21px Inter,Arial,Helvetica,sans-serif;fill:#F0F0F2}
      .link{font:22px Inter,Arial,Helvetica,sans-serif;fill:#C32ACC;text-decoration:underline}
    </style>
  </defs>

  <rect width="720" height="1026" fill="url(#bg)"/>

  <!-- logotipo inspirado diretamente no anexo fornecido -->
  <g transform="translate(360 92)">
    <path d="M0 5
             C-72 -65 -160 -16 -151 71
             C-142 157 -36 189 52 151
             C132 116 148 10 91 -54
             C43 -108 -51 -101 -105 -38"
          fill="none" stroke="#8B15AA" stroke-width="10" stroke-linecap="round"/>
    <path d="M-55 14
             C-10 -42 59 -24 66 30
             C72 76 24 109 -19 85
             C-51 67 -55 27 -31 6
             C-10 -12 22 -7 31 13
             C39 31 26 49 10 48"
          fill="none" stroke="#8B15AA" stroke-width="9" stroke-linecap="round"/>
    <circle cx="68" cy="152" r="7" fill="#8B15AA"/>
    <circle cx="88" cy="146" r="7" fill="#8B15AA"/>
    <circle cx="108" cy="137" r="6" fill="#8B15AA"/>
  </g>

  <text x="360" y="292" text-anchor="middle" class="serif" font-size="42" font-weight="700" fill="#FFFFFF">alma cuidada</text>
  <text x="360" y="323" text-anchor="middle" class="sans" font-size="20" font-weight="700" letter-spacing="7" fill="#9C22B3">mentoria terapêutica</text>

  <text x="360" y="407" text-anchor="middle" class="sans" font-size="39" font-weight="800" fill="#FFFFFF">Bem-vindo(a) ao Club 👋</text>
  <text x="360" y="452" text-anchor="middle" class="sans" font-size="24" fill="#F4F4F6">Todos os seus cursos em um só lugar.</text>

  <text x="92" y="526" class="label">Endereço de e-mail*</text>
  <rect x="92" y="548" width="536" height="78" rx="10" fill="#F0F5FC" stroke="#D9DFE8" stroke-width="2"/>
  <text x="116" y="598" class="sans" font-size="26" fill="#11151A">eusou@almacuidada.com.br</text>

  <text x="92" y="686" class="label">Senha de acesso*</text>
  <rect x="92" y="708" width="536" height="78" rx="10" fill="#F0F5FC" stroke="#D9DFE8" stroke-width="2"/>
  <text x="116" y="758" class="sans" font-size="29" fill="#11151A">••••••••••</text>
  <g transform="translate(590 747)" fill="none" stroke="#8D95A1" stroke-width="4">
    <path d="M-20 0 C-12 -12 -4 -17 0 -17 C4 -17 12 -12 20 0 C12 12 4 17 0 17 C-4 17 -12 12 -20 0 Z"/>
    <circle cx="0" cy="0" r="6"/>
  </g>

  <rect x="92" y="824" width="536" height="78" rx="14" fill="url(#btn)"/>
  <text x="360" y="874" text-anchor="middle" class="sans" font-size="27" font-weight="800" fill="#FFFFFF">Acessar minha conta</text>

  <text x="360" y="950" text-anchor="middle" class="link">Esqueci minha senha</text>
  <line x1="92" y1="982" x2="628" y2="982" stroke="#76777B" stroke-width="2"/>
  <text x="206" y="1018" class="sans" font-size="22">👉</text>
  <text x="252" y="1018" class="link">Não recebi o meu acesso</text>
</svg>