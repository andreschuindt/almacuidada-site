    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7a574"/><stop offset="1" stop-color="#b57f50"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edc9a4"/><stop offset="1" stop-color="#d3a06d"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd77b" stop-opacity=".65"/><stop offset="1" stop-color="#ffd77b" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3d2542" flood-opacity=".16"/></filter>
