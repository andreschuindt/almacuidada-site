<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" role="img" aria-labelledby="title desc">
  <title id="title">Diariamente — Bem-estar no Trabalho</title>
  <desc id="desc">Arte editorial do curso Diariamente, com uma mulher em momento de autocuidado no ambiente de trabalho.</desc>
